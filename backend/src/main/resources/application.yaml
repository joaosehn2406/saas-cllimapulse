spring:
  application:
    name: jceco-api

  datasource:
    url: jdbc:postgresql://localhost:5433/climapulse?currentSchema=climapulse,public
    username: climapulse
    password: climapulse

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: climapulse

  flyway:
    enabled: true
    default-schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: jceco-api
      auto-offset-reset: earliest
    producer:
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

climapulse:
  inpe:
    csv-base-url: https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/10min/
    live-import-cron: "0 2/10 * * * *"
    recent-files-count: 100
    catch-up-enabled: true

  open-meteo:
    base-url: https://api.open-meteo.com
    forecast-hours: 24
    past-hours: 1

  weather:
    coordinate-scale: 2
    snapshot-ttl: 1h

  kafka:
    hotspot-import-completed-topic: climate.hotspot.imported.v1

server:
  port: 8080
